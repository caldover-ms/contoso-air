apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow1
  labels:
    app.kubernetes.io/name: workflow1
    app.kubernetes.io/part-of: workflow1-project
    kubernetes.azure.com/generator: devhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow1
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80